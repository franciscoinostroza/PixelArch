<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="720" height="720" rx="40" fill="#07060c"/>

  <!-- Logo mark -->
  <g transform="translate(260, 220)">
    <rect x="0" y="0" width="90" height="90" rx="20" fill="url(#g)"/>
    <rect x="110" y="110" width="90" height="90" rx="20" fill="url(#g)" opacity="0.5"/>
  </g>

  <!-- Text -->
  <text x="360" y="460" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="72" fill="#f6f5f8" letter-spacing="-1">Pixel<tspan fill="url(#g)">Arch</tspan></text>

  <!-- Accent scan line -->
  <line x1="220" y1="485" x2="500" y2="485" stroke="url(#g)" stroke-width="2" opacity="0.6"/>
</svg>
