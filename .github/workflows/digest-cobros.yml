# Digest diario de cobros (reemplaza el cron de Railway).
# 12:00 UTC = 09:00 en Argentina (UTC-3). El schedule de GitHub puede
# retrasarse unos minutos; el horario es orientativo.
# Los secrets APP_URL (opcional) y CRON_SECRET (obligatorio) se configuran
# en GitHub: Settings > Secrets and variables > Actions. Nunca en el repo.
name: Digest diario de cobros

on:
  schedule:
    - cron: "0 12 * * *" # 12:00 UTC = 09:00 ARG
  workflow_dispatch:

permissions: {}

concurrency:
  group: digest-cobros
  cancel-in-progress: false

jobs:
  digest:
    name: Ejecutar digest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Invocar /api/cron/digest
        env:
          APP_URL: "${{ secrets.APP_URL || 'https://pixelarch.dev' }}"
          CRON_SECRET: "${{ secrets.CRON_SECRET }}"
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Falta el secret CRON_SECRET en GitHub Actions."
            exit 1
          fi

          case "${APP_URL}" in
            https://*) ;;
            *)
              echo "::error::APP_URL debe empezar con https://"
              exit 1
              ;;
          esac

          echo "Solicitando el digest a ${APP_URL%/}/api/cron/digest"
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 10 --retry-connrefused --max-time 60 \
            -H "x-cron-secret: ${CRON_SECRET}" \
            "${APP_URL%/}/api/cron/digest"
          echo
