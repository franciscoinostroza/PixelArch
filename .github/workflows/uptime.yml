# Uptime PixelArch (reemplaza el cron de la Function Railway `uptime-cron`).
# Corre cada 10 minutos. El schedule de GitHub puede retrasarse unos minutos y
# GitHub desactiva los workflows programados tras 60 dias sin actividad en el
# repositorio, asi que conviene revisar el estado cada tanto.
# Los secrets APP_URL (opcional) y CRON_SECRET (obligatorio) son los mismos
# que usa el workflow del digest; se configuran en GitHub:
# Settings > Secrets and variables > Actions. Nunca en el repo.
name: Uptime PixelArch

on:
  schedule:
    - cron: "*/10 * * * *" # cada 10 minutos
  workflow_dispatch:

permissions: {}

concurrency:
  group: uptime-pixelarch
  cancel-in-progress: false

jobs:
  uptime:
    name: Chequear servicios
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Invocar /api/cron/uptime
        env:
          APP_URL: "${{ secrets.APP_URL || 'https://pixelarch.dev' }}"
          CRON_SECRET: "${{ secrets.CRON_SECRET }}"
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Falta el secret CRON_SECRET en GitHub Actions."
            exit 1
          fi

          case "${APP_URL}" in
            https://*) ;;
            *)
              echo "::error::APP_URL debe empezar con https://"
              exit 1
              ;;
          esac

          echo "Solicitando el chequeo de uptime a ${APP_URL%/}/api/cron/uptime"
          # La respuesta es un JSON de estado sin PII: se muestra tal cual en el log.
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 5 --retry-connrefused --max-time 60 \
            -H "x-cron-secret: ${CRON_SECRET}" \
            "${APP_URL%/}/api/cron/uptime"
          echo
